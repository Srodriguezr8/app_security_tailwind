<!-- Modal de Medicamento (TailwindCSS) -->
<div id="medicamentoModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
  <div class="bg-white w-full max-w-4xl rounded-lg shadow-lg overflow-auto max-h-[90vh]">
    <!-- Header -->
    <div class="flex justify-between items-center bg-blue-600 text-white px-6 py-4 rounded-t-lg">
      <h2 class="text-lg font-semibold">Nuevo Medicamento</h2>
      <button onclick="cerrarModalMedicamento()" class="text-white text-xl">&times;</button>
    </div>

    <!-- Body -->
    <div class="p-6">
      <form id="medicamentoForm" onsubmit="event.preventDefault();">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Columna Izquierda -->
          <div>
            <!-- Tipo de Medicamento -->
            <div>
              <label for="tipo" class="block font-medium mb-1">Tipo de Medicamento *</label>
              <select id="tipo" name="tipo" required class="w-full border border-gray-300 rounded px-3 py-2">
                <option value="">Seleccione un tipo</option>
                {% for tipo in tipos_medicamento %}
                  <option value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Nombre -->
            <div class="mt-3">
              <label for="nombre" class="block font-medium mb-1">Nombre *</label>
              <input type="text" id="nombre" name="nombre" required placeholder="Ejemplo: Ibuprofeno"
                     class="w-full border border-gray-300 rounded px-3 py-2">
            </div>

            <!-- Marca -->
            <div class="mt-3">
              <label for="marca_medicamento" class="block font-medium mb-1">Marca</label>
              <select id="marca_medicamento" name="marca_medicamento"
                      class="w-full border border-gray-300 rounded px-3 py-2">
                <option value="">Sin marca específica</option>
                {% for marca in marcas_medicamento %}
                  <option value="{{ marca.id }}">{{ marca.nombre }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Concentración -->
            <div class="mt-3">
              <label for="concentracion" class="block font-medium mb-1">Concentración</label>
              <input type="text" id="concentracion" name="concentracion" placeholder="Ejemplo: 500mg, 1g, 5%"
                     class="w-full border border-gray-300 rounded px-3 py-2">
            </div>

            <!-- Vía de administración -->
            <div class="mt-3">
              <label for="via_administracion" class="block font-medium mb-1">Vía de Administración *</label>
              <select id="via_administracion" name="via_administracion" required
                      class="w-full border border-gray-300 rounded px-3 py-2">
                <option value="">Seleccione una vía</option>
                {% for via in ViaAdministracion.choices %}
                  <option value="{{ via.0 }}">{{ via.1 }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- Columna Derecha -->
          <div>
            <!-- Stock -->
            <div>
              <label for="cantidad" class="block font-medium mb-1">Stock *</label>
              <input type="number" id="cantidad" name="cantidad" min="0" required
                     class="w-full border border-gray-300 rounded px-3 py-2">
            </div>

            <!-- Precio -->
            <div class="mt-3">
              <label for="precio" class="block font-medium mb-1">Precio Unitario *</label>
              <div class="flex">
                <span class="inline-flex items-center px-3 bg-gray-200 border border-r-0 border-gray-300 rounded-l">$</span>
                <input type="number" id="precio" name="precio" step="0.01" min="0" required
                       class="w-full border border-gray-300 rounded-r px-3 py-2">
              </div>
            </div>

            <!-- Comercial -->
            <div class="mt-3 flex items-center gap-2">
              <input type="checkbox" id="comercial" name="comercial" class="toggle toggle-primary" checked>
              <label for="comercial" class="font-medium">Medicamento Comercial</label>
            </div>

            <!-- Activo -->
            <div class="mt-3 flex items-center gap-2">
              <input type="checkbox" id="activo" name="activo" class="toggle toggle-primary" checked>
              <label for="activo" class="font-medium">Activo</label>
            </div>

            <!-- Foto -->
            <div class="mt-3">
              <label for="foto" class="block font-medium mb-1">Foto del Medicamento</label>
              <input type="file" id="foto" name="foto" accept="image/*"
                     class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
          </div>
        </div>

        <!-- Descripción -->
        <div class="mt-4">
          <label for="descripcion" class="block font-medium mb-1">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="3"
                    class="w-full border border-gray-300 rounded px-3 py-2"
                    placeholder="Uso, indicaciones o precauciones relevantes"></textarea>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-2 bg-gray-100 px-6 py-4 rounded-b-lg">
      <button type="button" onclick="cerrarModalMedicamento()" class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500">Cancelar</button>
      <button type="submit" form="medicamentoForm" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Guardar</button>
    </div>
  </div>
</div>
