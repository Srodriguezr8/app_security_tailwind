<aside id="sidebar"
    class="bg-primary-custom w-64 border-r border-gray-200 p-6 flex flex-col justify-between transition-all duration-300 ease-in-out">
    <div class="flex-1 flex flex-col">
        <div class="flex items-center mb-8 relative">
            <div id="logo-medical"
                class="w-10 h-10 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15H9v-2h2v2zm0-4H9V8h2v5zm4 4h-2v-2h2v2zm0-4h-2V8h2v5z" />
                </svg>
            </div>

            <h2 class="text-2xl font-bold text-gray-900 dark:text-white transition-opacity duration-300 mr-2">MediCenter
            </h2>

            <button id="sidebar-toggle"
                class="absolute top-1/2 -translate-y-1/2 p-2 rounded-full shadow-custom border-custom text-secondary-custom hover:bg-secondary-custom transition-all duration-300 z-50">
                <svg id="toggle-icon-menu" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 25 25">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16">
                    </path>
                </svg>
                <svg id="toggle-icon-close" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 25 25">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

     <nav class="flex-1 overflow-y-auto overflow-x-hidden h-[calc(100vh-4rem)]" x-data="{ openMenus: [] }">
        <ul class="space-y-2">
            <li>
                <a href="#" class="flex items-center p-2 hover:bg-blue-50 rounded">
                    <i class="fas fa-home mr-3"></i>
                    <span class="hidden-collapsed">Inicio</span>
                </a>
            </li>
            </ul>
    </nav>


    </div>

    {% if user.is_authenticated %}
    <div class="mt-auto">
        <form method="POST" action="{% url 'security:signout' %}" class="w-full">
            {% csrf_token %}
            <button type="submit"
                class="flex items-center w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                <svg class="w-5 h-5 mr-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 0v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v8a4 4 0 004 4h3a4 4 0 004-4v-2">
                    </path>
                </svg>
                <span class="transition-opacity duration-300">Cerrar Sesión</span>
            </button>
        </form>
    </div>
    {% endif %}
</aside>

{% block js %}

<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('openMenus', []);
    });

      // Manejar navegación del navegador (botón atrás/adelante)
    window.addEventListener('popstate', function (event) {
        if (event.state && event.state.groupId !== undefined) {
            const groupSelected = document.getElementById('groupSelected');
            if (groupSelected) {
                groupSelected.value = event.state.groupId || '';
                // Disparar evento change para actualizar menús
                groupSelected.dispatchEvent(new Event('change'));
            }
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        // --- Gestión de la barra lateral (colapsar/expandir) ---
        const sidebar = document.getElementById('sidebar');
        const sidebarToggleBtn = document.getElementById('sidebar-toggle');
        const toggleIconMenu = document.getElementById('toggle-icon-menu');
        const toggleIconClose = document.getElementById('toggle-icon-close');

        toggleIconMenu.style.display = 'block';
        toggleIconClose.style.display = 'none';

        sidebarToggleBtn.addEventListener('click', function() {
            sidebar.classList.toggle('sidebar-expanded');
            sidebar.classList.toggle('sidebar-collapsed');

            if (sidebar.classList.contains('sidebar-collapsed')) {
                toggleIconMenu.style.display = 'none';
                toggleIconClose.style.display = 'block';
            } else {
                toggleIconMenu.style.display = 'block';
                toggleIconClose.style.display = 'none';
            }
        });

        sidebar.classList.add('sidebar-expanded');


        // --- Gestión del Dropdown de Usuario ---
        const userDropdown = document.getElementById('userDropdown');
        if (userDropdown) {
            const userDropdownMenu = document.getElementById('userDropdownMenu');
            const userDropdownIcon = document.getElementById('userDropdownIcon');

            function toggleUserDropdown() {
                const isVisible = !userDropdownMenu.classList.contains('opacity-0');
                if (isVisible) {
                    userDropdownMenu.classList.add('opacity-0', 'invisible', 'scale-95');
                    userDropdownMenu.classList.remove('opacity-100', 'visible', 'scale-100');
                    userDropdownIcon.classList.remove('rotate-180');
                } else {
                    userDropdownMenu.classList.remove('opacity-0', 'invisible', 'scale-95');
                    userDropdownMenu.classList.add('opacity-100', 'visible', 'scale-100');
                    userDropdownIcon.classList.add('rotate-180');
                }
            }

            userDropdown.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                toggleUserDropdown();
            });

            document.addEventListener('click', function (e) {
                if (!userDropdown.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                    if (!userDropdownMenu.classList.contains('opacity-0')) {
                        toggleUserDropdown();
                    }
                }
            });

            userDropdownMenu.addEventListener('click', function (e) {
                e.stopPropagation();
            });
        }


    
        // --- Carga inicial (MODIFICADA para usar el valor 'selected' por Django) ---
        const groupSelect = document.getElementById('groupSelected');

    
        if (groupSelect) {
            const initialSelectedGroupId = groupSelect.value; // Lee el valor de la opción 'selected' por Django

            if (initialSelectedGroupId) { // Si hay un grupo seleccionado (no la opción vacía)
                confirm(`Grupo seleccionado: ${initialSelectedGroupId}`);
                loadAndRenderMenus(initialSelectedGroupId);
            } else {
                // Si no hay un grupo seleccionado por Django, o la opción por defecto es vacía
                const menuContainer = document.querySelector('#sidebar nav ul');
                const dashboardItem = menuContainer.querySelector('li:first-child');
                menuContainer.innerHTML = ''; // Limpia los menús existentes
                if (dashboardItem) {
                    menuContainer.appendChild(dashboardItem);
                }
                const selectGroupLi = document.createElement('li');
                selectGroupLi.className = 'text-gray-500 py-2';
                selectGroupLi.textContent = 'Por favor, selecciona un grupo para ver los módulos.';
                menuContainer.appendChild(selectGroupLi);
            }

            // --- Gestión del Selector de Grupos (evento change) ---
            groupSelect.addEventListener('change', function () {
                const selectedGroupId = this.value;
                if (selectedGroupId) { // Solo cargar si se seleccionó un valor (no la opción vacía)
                    loadAndRenderMenus(selectedGroupId);
                } else {
                    // Si el usuario selecciona la opción "Seleccionar Grupo", limpiar los menús
                    const menuContainer = document.querySelector('#sidebar nav ul');
                    const dashboardItem = menuContainer.querySelector('li:first-child');
                    menuContainer.innerHTML = '';
                    if (dashboardItem) {
                        menuContainer.appendChild(dashboardItem);
                    }
                    const selectGroupLi = document.createElement('li');
                    selectGroupLi.className = 'text-gray-500 py-2';
                    selectGroupLi.textContent = 'Por favor, selecciona un grupo para ver los módulos.';
                    menuContainer.appendChild(selectGroupLi);
                }
            });
        }
    });

    // --- Función para crear un elemento de menú con Alpine.js ---
    function createMenuElement(menu) {
        const li = document.createElement('li');
        li.className = 'mb-2';

        const menuId = `menu-${menu.id}`;

        let menuHtml = `
            <button
                @click="$store.openMenus.includes('${menuId}') ? $store.openMenus.splice($store.openMenus.indexOf('${menuId}'), 1) : $store.openMenus.push('${menuId}')"
                class="w-full flex items-center justify-between px-4 py-3 text-left text-primary-custom rounded-lg menu-item hover:bg-secondary-custom hover:text-white transition-colors duration-200"
            >
                <div class="flex items-center">
                    <i class="${menu.icon || ''} mr-3 text-xl"></i>
                    <span class="font-medium">${menu.name}</span>
                </div>
                <svg class="w-4 h-4 transition-transform duration-200"
                    :class="{ 'transform rotate-180': $store.openMenus.includes('${menuId}') }"
                    fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        `;

        if (menu.modules && menu.modules.length > 0) {
            menuHtml += `
                <div
                    x-show="$store.openMenus.includes('${menuId}')"
                    x-collapse
                    class="ml-4 mt-2 space-y-1"
                >
            `;
            menu.modules.forEach(module => {
                menuHtml += `
                    <a href="${module.url}"
                        class="w-full flex items-center px-4 py-2 text-left text-secondary-custom rounded-md mb-1 submenu-item hover:bg-tertiary-custom transition-colors duration-200">
                        <i class="${module.icon || ''} mr-3 text-m"></i>
                        <span class="text-sm">${module.name}</span>
                    </a>
                `;
            });
            menuHtml += `
                </div>
            `;
        }

        li.innerHTML = menuHtml;
        return li;
    }

    function loadContent(url) {
        console.log(`Cargando contenido de: ${url}`);
        window.location.href = url;
    }

</script>




{% endblock %}
