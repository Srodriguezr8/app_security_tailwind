<aside id="sidebar"
    class="w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 p-6 flex flex-col justify-between transition-all duration-300 ease-in-out">
    <div>

        <div class="flex items-center space-x-2 mb-8 relative">

            <div
                class="w-10 h-10 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15H9v-2h2v2zm0-4H9V8h2v5zm4 4h-2v-2h2v2zm0-4h-2V8h2v5z" />
                </svg>
            </div>

            <!-- Agrega margen derecho al título -->
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white transition-opacity duration-300 mr-2">MediCenter</h2>

           
        <!-- Botón Toggle Sidebar -->
        <button id="sidebar-toggle"
            class="absolute top-1/2 -translate-y-1/2 right-0 p-1 rounded-full bg-white dark:bg-gray-800 shadow-md border border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 transition-all duration-300 z-50">

            <!-- Icono ☰ -->
            <svg id="toggle-icon-menu" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>

            <!-- Icono X (opcional) -->
            <svg id="toggle-icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        </div>

        <nav>
            <ul>
                <li class="mb-2">
                    <a href="{% url 'security:home' %}" class="flex items-center px-4 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-blue-500 hover:text-white transition-colors duration-200
                        {% if request.resolver_match.url_name == 'home' %}bg-blue-600 text-white shadow-md{% endif %}">
                        <svg class="w-5 h-5 mr-3" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zm0-8h14V7H7v2z" />
                        </svg>
                        <span class="transition-opacity duration-300">Dashboard</span>
                    </a>
                </li>
                <!-- Resto de los elementos del menú -->
            </ul>
        </nav>

    </div>

    {% if user.is_authenticated %}
    <div class="mt-auto">
        <form method="POST" action="{% url 'security:signout' %}" class="w-full">
            {% csrf_token %}
            <button type="submit"
                class="flex items-center w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-200">
                <svg class="w-5 h-5 mr-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 0v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v8a4 4 0 004 4h3a4 4 0 004-4v-2">
                    </path>
                </svg>
                <span class="transition-opacity duration-300">Cerrar Sesión</span>
            </button>
        </form>
    </div>
    {% endif %}
    
</aside>
