<div class="text-center">
    <div class="w-16 h-16 bg-gradient-to-r from-green-500 to-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-md">
        <i class="fas fa-user-check text-white text-2xl"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Actualizar Estado</h2>
    <p class="text-gray-600 mt-1">¿Deseas cambiar el estado de <strong>{{ user.get_full_name }}</strong>?</p>
</div>

<form method="post" action="{% url 'security:user_status_update' user.id %}" class="space-y-5">
    {% csrf_token %}
    <div class="flex items-center justify-center space-x-3">
        <input type="checkbox" name="is_active" id="activeCheck" {% if user.is_active %}checked{% endif %}
               class="form-checkbox h-5 w-5 text-green-600 focus:ring-2 focus:ring-green-500 rounded">
        <label for="activeCheck" class="text-gray-700 dark:text-white font-medium">¿Está activo?</label>
    </div>

    <div class="flex justify-end gap-3">
        <button type="button" onclick="closeStatusModal()"
                class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400 dark:bg-gray-600 dark:text-white">
            Cancelar
        </button>
        <button type="submit"
                class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
            Guardar Cambios
        </button>
    </div>
</form>
