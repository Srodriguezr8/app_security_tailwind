{% load static %}
{% include 'fragments/messages.html' %} {# Asumo que este es un fragmento global de mensajes #}

<section class="mt-2">
    <div class="text-center" data-aos="fade-up" data-aos-delay="200">
        <h1 class="rounded-2xl bg-indigo-500 px-2 py-1 text-white uppercase text-4xl mt-4">
            {{ title1 }}
        </h1>

        <div class="p-4 flex justify-center">
            <form id="userSearchForm" method="GET" class="relative w-full max-w-md">
                <input type="text" name="q" placeholder="Buscar por nombre o correo"
                    class="text-center pl-10 shadow-sm w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 dark:bg-principal dark:border-gray-600 dark:placeholder-gray-400 dark:text-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500"
                    value="{{ request.GET.q }}">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg class="w-4 h-4 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 20 20">
                        <path d="M19 19l-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
            </form>
        </div>

        <div class="overflow-x-auto px-4">
            <table class="w-full text-center text-lg">
                <thead class="uppercase font-Tiny5 bg-gray-50 dark:bg-secundario dark:text-blue-300">
                    <tr>
                        <th class="px-6 py-3">ID</th>
                        <th class="px-6 py-3">Nombre</th>
                        <th class="px-6 py-3">Apellido</th>
                        <th class="px-6 py-3">Correo</th>
                        <th class="px-6 py-3">Activo</th>
                        <th class="px-6 py-3">Acciones</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    {% include 'security/users/user_table_body.html' %}
                </tbody>
            </table>
        </div>

        <div class="flex justify-center mt-4">
            <nav id="userPaginationNav">
                {% include 'security/users/user_pagination_nav.html' %}
            </nav>
        </div>
    </div>
</section>

<script>
    console.log('Script de user_list_partial.html ejecutado. (Este mensaje debe aparecer solo una vez por carga del parcial)');

    // Función para manejar las solicitudes de filtro y paginación
async function fetchUsers(url) {
    try {
        // ... (código para mostrar indicador de carga) ...

        const response = await fetch(url, {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        });

        if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
        }

        const data = await response.json(); // Aquí recibimos el JSON del servidor

        // *** ESTA ES LA PARTE CRÍTICA QUE DEBEMOS REVISAR ***
        // Actualiza solo el cuerpo de la tabla
        const userTableBody = document.getElementById('userTableBody');
        if (userTableBody) {
            userTableBody.innerHTML = data.table_body_html; // <--- ¿Se está actualizando correctamente?
        } else {
            console.error("Contenedor 'userTableBody' no encontrado en el DOM.");
        }

        // Actualiza solo la navegación de paginación
        const userPaginationNav = document.getElementById('userPaginationNav');
        if (userPaginationNav) {
            userPaginationNav.innerHTML = data.pagination_html; // <--- ¿Se está actualizando correctamente?
        } else {
            console.error("Contenedor 'userPaginationNav' no encontrado en el DOM.");
        }

        // Opcional: Actualizar la URL en la barra del navegador (sin recargar la página)
        history.pushState(null, '', url);

    } catch (error) {
        console.error("Hubo un error al cargar la lista de usuarios:", error);
        // ... (código para manejar y mostrar el error al usuario) ...
    }
}
    // Lógica de búsqueda: Ahora llama a fetchUsers para actualizaciones parciales
    const userSearchForm = document.getElementById('userSearchForm');
    if (userSearchForm) {
        userSearchForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const searchTerm = userSearchForm.querySelector('input[name="q"]').value;
            let newUrl = '/security/user_list/';
            if (searchTerm) {
                newUrl += `?q=${encodeURIComponent(searchTerm)}`;
            }
            fetchUsers(newUrl); // <-- Llama a la nueva función de fetch
        });
    }

    // Lógica de paginación: Ahora usa delegación de eventos y llama a fetchUsers
    const userPaginationNav = document.getElementById('userPaginationNav');
    if (userPaginationNav) {
        userPaginationNav.addEventListener('click', function (e) {
            const paginationLink = e.target.closest('.pagination-link');
            if (paginationLink) {
                e.preventDefault();
                const href = paginationLink.getAttribute('href');
                if (href) {
                    const baseUrl = '/security/user_list/';
                    let newUrl = baseUrl;
                    const queryParams = href.split('?')[1];
                    if (queryParams) {
                        newUrl += `?${queryParams}`;
                    }
                    fetchUsers(newUrl); // <-- Llama a la nueva función de fetch
                }
            }
        });
    }

    // Lógica para el botón de alternar estado (si existe)
    // Importante: Usar delegación de eventos ya que las filas de la tabla se actualizan dinámicamente
    document.addEventListener('click', function (e) {
        const button = e.target.closest('.btn-status-toggle');
        if (button) {
            e.preventDefault(); // Evita cualquier acción por defecto del botón
            const userId = button.dataset.userId;
            console.log(`Botón de estado clicado para el usuario ID: ${userId}`);
            // Aquí iría tu lógica para manejar la edición de estado.
            // Por ejemplo, abrir un modal de confirmación, o hacer una llamada AJAX
            // para cambiar el estado del usuario.
            // Si después de la acción necesitas recargar la lista, puedes llamar a fetchUsers
            // con la URL actual o la URL de la página 1 para refrescar los datos.
            // fetchUsers(window.location.href); // Para recargar la página actual
        }
    });

</script>
