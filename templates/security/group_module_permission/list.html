{% extends 'home.html' %} 
<title>{% block title %}Gestión de Permisos{% endblock %}</title>
{% block content %}
    {% load static %}
    
    <section class="dark:bg-principal mt-2">
        <div class="text-center" data-aos="fade-up" data-aos-delay="200">
            <div class="sm:pt-8 lg:pt-4">
                <h1 class="rounded-2xl bg-indigo-500 px-2 py-1 text-white uppercase text-4xl">
                    Gestión de Permisos Grupos-Módulos
                </h1>
            </div>
            
            <!-- Combobox de Grupos -->
            <div class="lg:p-2 rounded-3xl" data-aos="fade-up" data-aos-delay="200">
                <div class="p-4 flex justify-center">
                    <div class="relative">
                        <label for="groupSelect" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                            Seleccionar Grupo:
                        </label>
                        <select id="groupSelect" 
                                class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-80 p-2.5 dark:bg-principal dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500">
                            <option value="">Seleccione un grupo</option>
                            {% for group in groups %}
                                <option value="{{ group.id }}">{{ group.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal 1: Módulos del grupo -->
    <div id="modulesModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white dark:bg-[#0b1121] dark:border-gray-600">
            <!-- Header del modal -->
            <div class="flex justify-between items-center pb-3 border-b border-gray-200 dark:border-gray-600">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                    Módulos del Grupo: <span id="selectedGroupName" class="text-indigo-600"></span>
                </h3>
                <button id="closeModulesModal" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Contenido del modal -->
            <div class="py-4 max-h-96 overflow-y-auto">
                <div id="modulesList" class="space-y-3">
                    <!-- Los módulos se cargarán aquí dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal 2: Permisos del grupo sobre el módulo -->
    <div id="permissionsModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-60">
        <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-1/2 shadow-lg rounded-md bg-white dark:bg-[#0b1121] dark:border-gray-600">
            <!-- Header del modal -->
            <div class="flex justify-between items-center pb-3 border-b border-gray-200 dark:border-gray-600">
                <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
                    Permisos de <span id="selectedModuleName" class="text-indigo-600"></span>
                </h3>
                <button id="closePermissionsModal" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-600 dark:hover:text-white">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Contenido del modal -->
            <div class="py-4">
                <div id="permissionsList" class="space-y-3 max-h-64 overflow-y-auto mb-4">
                    <!-- Los permisos se cargarán aquí dinámicamente -->
                </div>
                
                <!-- Botón Guardar -->
                <div class="flex justify-end pt-3 border-t border-gray-200 dark:border-gray-600">
                    <button id="savePermissions" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-300">
                        <i class="fa-solid fa-save mr-2"></i>Guardar Permisos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmación para Eliminar -->
    <div id="confirmDeleteModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-60">
        <div class="relative top-1/2 transform -translate-y-1/2 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white dark:bg-[#0b1121] dark:border-gray-600">
            <div class="text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 dark:bg-red-900 mb-4">
                    <i class="fa-solid fa-trash text-red-600 dark:text-red-400 text-xl"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">Confirmar Eliminación</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">
                    ¿Estás seguro de eliminar los permisos del módulo <span id="moduleToDelete" class="font-semibold"></span> para este grupo?
                </p>
                <div class="flex justify-center space-x-3">
                    <button id="confirmDelete" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-300">
                        <i class="fa-solid fa-trash mr-2"></i>Eliminar
                    </button>
                    <button id="cancelDelete" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg transition-colors duration-300">
                        Cancelar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Variables globales
        let currentGroupId = null;
        let currentModuleId = null;
        let currentModuleName = null;
        let currentModuleCheckbox = null;

        // Referencias a elementos DOM
        const groupSelect = document.getElementById('groupSelect');
        const modulesModal = document.getElementById('modulesModal');
        const permissionsModal = document.getElementById('permissionsModal');
        const confirmDeleteModal = document.getElementById('confirmDeleteModal');
        
        // Event listener para el select de grupos
        groupSelect.addEventListener('change', function() {
            const groupId = this.value;
            const groupName = this.options[this.selectedIndex].text;
            
            if (groupId) {
                currentGroupId = groupId;
                document.getElementById('selectedGroupName').textContent = groupName;
                loadModules();
                showModal('modulesModal');
            }
        });

        // Event listeners para cerrar modales
        document.getElementById('closeModulesModal').addEventListener('click', function() {
            hideModal('modulesModal');
            resetGroupSelect();
        });

        document.getElementById('closePermissionsModal').addEventListener('click', function() {
            hideModal('permissionsModal');
            // Desmarcar el checkbox del módulo en el primer modal
            if (currentModuleCheckbox) {
                currentModuleCheckbox.checked = false;
            }
        });

        // Event listeners para confirmar eliminación
        document.getElementById('confirmDelete').addEventListener('click', function() {
            deleteModulePermissions();
        });

        document.getElementById('cancelDelete').addEventListener('click', function() {
            hideModal('confirmDeleteModal');
        });

        // Event listener para guardar permisos
        document.getElementById('savePermissions').addEventListener('click', function() {
            savePermissions();
        });

        // Cerrar modales al hacer clic fuera
        window.addEventListener('click', function(event) {
            if (event.target === modulesModal) {
                hideModal('modulesModal');
                resetGroupSelect();
            }
            if (event.target === permissionsModal) {
                hideModal('permissionsModal');
                if (currentModuleCheckbox) {
                    currentModuleCheckbox.checked = false;
                }
            }
            if (event.target === confirmDeleteModal) {
                hideModal('confirmDeleteModal');
            }
        });

        // Funciones para mostrar/ocultar modales
        function showModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function hideModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function resetGroupSelect() {
            groupSelect.value = "";
        }

        // Cargar módulos del sistema
        async function loadModules() {
            try {
                const modulesList = document.getElementById('modulesList');
                modulesList.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i></div>';
                
                // Obtener todos los módulos
                const modules = {{modules|safe}};
                
                let html = '';
                for (const module of modules) {
                    // Obtener cantidad de permisos para este grupo y módulo
                    const permissionsCount = await getPermissionsCount(currentGroupId, module.id);
                    
                    html += `
                        <div class="flex items-center justify-between p-3 border border-gray-200 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">
                            <div class="flex items-center">
                                <input type="checkbox" id="module_${module.id}" class="module-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" data-module-id="${module.id}" data-module-name="${module.name}">
                                <label for="module_${module.id}" class="ml-3 text-sm font-medium text-gray-900 dark:text-gray-300 cursor-pointer">${module.name}</label>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="inline-flex items-center justify-center w-6 h-6 text-xs font-bold text-white bg-blue-600 rounded-full">
                                    ${permissionsCount}
                                </span>
                                <button class="delete-module-permissions text-red-600 hover:text-red-800 p-1" data-module-id="${module.id}" data-module-name="${module.name}" title="Eliminar permisos">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
                
                modulesList.innerHTML = html;
                
                // Agregar event listeners a los checkboxes
                document.querySelectorAll('.module-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        if (this.checked) {
                            currentModuleId = this.dataset.moduleId;
                            currentModuleName = this.dataset.moduleName;
                            currentModuleCheckbox = this;
                            document.getElementById('selectedModuleName').textContent = currentModuleName;
                            loadModulePermissions();
                            showModal('permissionsModal');
                        }
                    });
                });
                
                // Agregar event listeners a los botones de eliminar
                document.querySelectorAll('.delete-module-permissions').forEach(button => {
                    button.addEventListener('click', function() {
                        const moduleId = this.dataset.moduleId;
                        const moduleName = this.dataset.moduleName;
                        document.getElementById('moduleToDelete').textContent = moduleName;
                        currentModuleId = moduleId;
                        showModal('confirmDeleteModal');
                    });
                });
                
            }catch (error) {
                console.error('Error cargando módulos:', error);
                showMessage('Error al cargar los módulos', 'error');
            }
        }

        // Obtener cantidad de permisos
        async function getPermissionsCount(groupId, moduleId) {
            try {
                const response = await fetch(`/security/group-module-permission/permissions/?group_id=${groupId}&module_id=${moduleId}`);
                const data = await response.json();
                return data.count_permission || 0;
            } catch (error) {
                console.error('Error obteniendo cantidad de permisos:', error);
                return 0;
            }
        }

        // Cargar permisos del módulo
        async function loadModulePermissions() {
            try {
                const permissionsList = document.getElementById('permissionsList');
                permissionsList.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i></div>';
                
                // Obtener permisos disponibles del módulo
                const moduleResponse = await fetch(`/security/module/${currentModuleId}/permissions/`);
                const moduleData = await moduleResponse.json();
                
                // Obtener permisos actuales del grupo para este módulo
                const currentResponse = await fetch(`/security/group-module-permission/permissions/?group_id=${currentGroupId}&module_id=${currentModuleId}`);
                const currentData = await currentResponse.json();
                
                const currentPermissions = currentData.permissions.map(p => p.id);
                
                let html = '';
                if (moduleData.modules && moduleData.modules.length > 0) {
                    moduleData.modules.forEach(permission => {
                        const isChecked = currentPermissions.includes(permission.id) ? 'checked' : '';
                        html += `
                            <div class="flex items-center p-2 border border-gray-200 dark:border-gray-600 rounded">
                                <input type="checkbox" id="permission_${permission.id}" class="permission-checkbox w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 rounded focus:ring-blue-500 dark:focus:ring-blue-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" value="${permission.id}" ${isChecked}>
                                <label for="permission_${permission.id}" class="ml-3 text-sm font-medium text-gray-900 dark:text-gray-300 cursor-pointer">${permission.name}</label>
                            </div>
                        `;
                    });
                } else {
                    html = '<p class="text-gray-500 dark:text-gray-400 text-center py-4">No hay permisos disponibles para este módulo</p>';
                }
                
                permissionsList.innerHTML = html;
                
            } catch (error) {
                console.error('Error cargando permisos del módulo:', error);
                showMessage('Error al cargar los permisos del módulo', 'error');
            }
        }

        // Guardar permisos
        async function savePermissions() {
            try {
                const saveButton = document.getElementById('savePermissions');
                const originalText = saveButton.innerHTML;
                saveButton.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Guardando...';
                saveButton.disabled = true;
                
                const selectedPermissions = [];
                document.querySelectorAll('.permission-checkbox:checked').forEach(checkbox => {
                    selectedPermissions.push(parseInt(checkbox.value));
                });
                
                const response = await fetch('/security/group-module-permission/save/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        group_id: parseInt(currentGroupId),
                        module_id: parseInt(currentModuleId),
                        permissions: selectedPermissions
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(data.success, 'success');
                    hideModal('permissionsModal');
                    // Desmarcar el checkbox del módulo
                    if (currentModuleCheckbox) {
                        currentModuleCheckbox.checked = false;
                    }
                    // Recargar módulos para actualizar el contador
                    loadModules();
                } else {
                    showMessage(data.error || 'Error al guardar los permisos', 'error');
                }
                
            } catch (error) {
                console.error('Error guardando permisos:', error);
                showMessage('Error al guardar los permisos', 'error');
            } finally {
                const saveButton = document.getElementById('savePermissions');
                saveButton.innerHTML = '<i class="fa-solid fa-save mr-2"></i>Guardar Permisos';
                saveButton.disabled = false;
            }
        }

        // Eliminar permisos del módulo
        async function deleteModulePermissions() {
            try {
                const response = await fetch('/security/group-module-permission/delete/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        group_id: parseInt(currentGroupId),
                        module_id: parseInt(currentModuleId)
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'deleted') {
                    showMessage(data.message, 'success');
                    hideModal('confirmDeleteModal');
                    // Recargar módulos para actualizar el contador
                    loadModules();
                } else if (data.status === 'not_found') {
                    showMessage(data.message, 'info');
                    hideModal('confirmDeleteModal');
                } else {
                    showMessage(data.error || 'Error al eliminar los permisos', 'error');
                }
                
            } catch (error) {
                console.error('Error eliminando permisos:', error);
                showMessage('Error al eliminar los permisos', 'error');
            }
        }

        // Obtener CSRF token
        function getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]')?.value || 
                   document.cookie.split('; ')
                       .find(row => row.startsWith('csrftoken='))
                       ?.split('=')[1];
        }

        // Mostrar mensajes
        function showMessage(message, type) {
            // Esta función asume que tienes un sistema de mensajes similar al de Django
            // Puedes adaptarla según tu implementación actual
            const messageDiv = document.createElement('div');
            let bgClass = '';
            let textClass = '';
            let icon = '';
            
            switch (type) {
                case 'success':
                    bgClass = 'bg-green-100 border-green-400 text-green-700';
                    icon = 'fa-check-circle';
                    break;
                case 'error':
                    bgClass = 'bg-red-100 border-red-400 text-red-700';
                    icon = 'fa-exclamation-circle';
                    break;
                case 'info':
                    bgClass = 'bg-blue-100 border-blue-400 text-blue-700';
                    icon = 'fa-info-circle';
                    break;
            }
            
            messageDiv.className = `border px-4 py-3 rounded mb-4 ${bgClass}`;
            messageDiv.innerHTML = `
                <div class="flex items-center">
                    <i class="fa-solid ${icon} mr-2"></i>
                    <span>${message}</span>
                    <button class="ml-auto" onclick="this.parentElement.parentElement.remove()">
                        <i class="fa-solid fa-times"></i>
                    </button>
                </div>
            `;
            
            // Insertar el mensaje al inicio del contenido
            const content = document.querySelector('section');
            content.insertBefore(messageDiv, content.firstChild);
            
            // Auto-eliminar después de 5 segundos
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.remove();
                }
            }, 5000);
        }
    </script>

{% endblock %}
