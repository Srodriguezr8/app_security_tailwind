name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Obtener el codigo
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verificar configuracion de Django
      run: |
        python manage.py check --settings=proy_clinico.settings_ci

    - name: Ejecutar migraciones de prueba
      run: |
        python manage.py migrate --run-syncdb --settings=proy_clinico.settings_ci